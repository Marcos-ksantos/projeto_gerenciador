<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/gerenciador.css">
    <script src="js/gerenciador.js" defer></script>

    <title>Gerenciador</title>
</head>

<body>
    <h3>Gerenciador de Tarefas</h3>

    <form id="formulario">
        <label for="tarefa">Tarefa</label>
        <input type="text" name="tarefa" id="tarefa" placeholder="Informe sua tarefa" >

        <label for="responsavel">Responsável</label>
        <input type="text" name="responsavel" id="responsavel" placeholder="Informe seu Responsável" >

        <label for="descricao">Descrição</label>
        <textarea name="descricao" id="descricao" placeholder="Descreva sua tarefa" ></textarea>

        <label for="prioridade">Defina a prioridade</label>
        <select id="prioridade" >
            <option value="baixa">Baixa</option>
            <option value="media">Média</option>
            <option value="alta">Alta</option>
        </select>

        <label for="data">Data da tarefa</label>
        <input type="date" name="data" id="data" >

        <button type="submit" id="btn-adicionar">Adicionar Tarefa</button>

    </form>

    <section id="listaTarefas"></section>
</body>

</html>
